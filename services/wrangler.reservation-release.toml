# Production activation approved by the owner on 11 October 2026.
# Standard bank guarantee through 3 nights; cash deposit from 4 nights.
name = "letapeduberry-reservation"
main = "request-worker.mjs"
compatibility_date = "2026-10-04"
workers_dev = false
routes = [
 { pattern = "letapeduberry.fr/api/stripe/webhook-test", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/stripe/webhook", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/availability", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/status", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/request", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/admin/*", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/api/guest/*", zone_name = "letapeduberry.fr" },
 { pattern = "letapeduberry.fr/calendrier/direct/*", zone_name = "letapeduberry.fr" }
]
[[d1_databases]]
binding = "BERRY_DB"
database_name = "letapeduberry-reservations"
database_id = "92034594-f295-4110-b6a9-7149f5666fcf"
migrations_dir = "migrations"
[vars]
# Enable only after Stripe confirms account eligibility; actual capture_before is still checked.
STRIPE_EXTENDED_AUTHORIZATION_ENABLED = "false"
STRIPE_MODE = "live"
OWNER_PAYMENT_TEST_ENABLED = "true"
STRIPE_WEBHOOK_ENABLED = "true"
STRIPE_LIVE_ENABLED = "true"
REQUESTS_ENABLED = "true"
GUEST_MESSAGES_ENABLED = "true"
CONTRACT_APPROVED = "true"
TOURIST_TAX_RATE = "0.05"
TOURIST_TAX_ADDITIONAL_RATE = "0.10"
TOURIST_TAX_DESCRIPTION = "5 % du prix de l’hébergement par personne et par nuitée, hors taxe de séjour, avec une taxe additionnelle départementale de 10 %."
SITE_ORIGIN = "https://letapeduberry.fr"
CONTACT_FROM = "L’Étape du Berry <site@messages.letapeduberry.fr>"
# Incoming signed Stripe events and outgoing live payments enabled by owner approval.
# Configure Access issuer/AUD/email, owner details, calendar and Resend
# before any public reservation or scheduled guest message activation.
# Routes must target the exact API paths; do not replace /api/contact.
# Protect /gestion, /gestion.html, /api/admin and /api/admin/* with Access.
# Restrict to the exact owner email; see access-setup.md before activation.
[triggers]
crons = ["*/5 * * * *"]
[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
